# EGS: logs PHP; revisar cada 15 minutos. Conservar un archivo comprimido por log.

"/home/egsequip/logs/comercializadoraegs_com.php.error.log" {
    size 10M
    rotate 1
    compress
    copytruncate
    missingok
    notifempty
    olddir /home/egsequip/.egs-log-maintenance/wordpress-php
}

"/home/egsequip/logs/backend_comercializadoraegs_com.php.error.log" {
    size 10M
    rotate 1
    compress
    copytruncate
    missingok
    notifempty
    olddir /home/egsequip/.egs-log-maintenance/backend-php
}

"/home/egsequip/public_html/error_log" {
    size 10M
    rotate 1
    compress
    copytruncate
    missingok
    notifempty
    olddir /home/egsequip/.egs-log-maintenance/wordpress-root
}

"/home/egsequip/public_html/wp-admin/error_log" {
    size 10M
    rotate 1
    compress
    copytruncate
    missingok
    notifempty
    olddir /home/egsequip/.egs-log-maintenance/wordpress-admin
}

"/home/egsequip/.egs-log-maintenance/rotation.log" {
    size 100k
    rotate 1
    compress
    copytruncate
    missingok
    notifempty
}
